name: Build Second Look APK (single file)

# Everything needed to build the app is inside this one file.
# Put it in a new GitHub repository at:  .github/workflows/build-apk.yml

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the project files
        run: |
          set -e
          mkdir -p app app/src/main app/src/main/assets/web app/src/main/java/com/secondlook/app app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/values app/src/main/res/xml
          cat > settings.gradle.kts <<'__SL_EOF__'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SecondLook"
          include(":app")
          __SL_EOF__
          cat > build.gradle.kts <<'__SL_EOF__'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          __SL_EOF__
          cat > gradle.properties <<'__SL_EOF__'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          __SL_EOF__
          cat > app/build.gradle.kts <<'__SL_EOF__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.secondlook.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.secondlook.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.webkit:webkit:1.11.0")
              implementation("androidx.exifinterface:exifinterface:1.3.7")
              // On-device text recognition (the model is bundled, so it works offline)
              implementation("com.google.mlkit:text-recognition:16.0.1")
          }
          __SL_EOF__
          cat > app/src/main/AndroidManifest.xml <<'__SL_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <queries>
                  <intent>
                      <action android:name="android.media.action.IMAGE_CAPTURE" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Second Look"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.SecondLook">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|uiMode"
                      android:windowSoftInputMode="adjustResize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <!-- "Share" a screenshot or text straight to Second Look from any app -->
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="image/*" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          __SL_EOF__
          cat > app/src/main/res/xml/file_paths.xml <<'__SL_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="photos" path="photos/" />
          </paths>
          __SL_EOF__
          cat > app/src/main/res/values/styles.xml <<'__SL_EOF__'
          <resources>
              <style name="Theme.SecondLook" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:windowBackground">@color/window_bg</item>
                  <item name="android:statusBarColor">@color/status_bar</item>
                  <item name="android:navigationBarColor">@color/window_bg</item>
              </style>
          </resources>
          __SL_EOF__
          cat > app/src/main/res/values/colors.xml <<'__SL_EOF__'
          <resources>
              <color name="window_bg">#F7F3FF</color>
              <color name="status_bar">#4B1FD1</color>
              <color name="ic_background">#7B2FE0</color>
          </resources>
          __SL_EOF__
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'__SL_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_background" />
              <foreground android:drawable="@drawable/ic_foreground" />
          </adaptive-icon>
