      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build the APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Name the file
        run: cp app/build/outputs/apk/debug/app-debug.apk SecondLook.apk

      - name: Keep a copy with this run
        uses: actions/upload-artifact@v4
        with:
          name: SecondLook-apk
          path: SecondLook.apk

      - name: Publish a download link (Releases page)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Second Look APK (latest)
          body: Tap SecondLook.apk below to download the app, then open it to install.
          files: SecondLook.apk
