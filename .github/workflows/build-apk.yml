          cat > app/src/main/java/com/secondlook/app/MainActivity.kt <<'__SL_EOF__'
          package com.secondlook.app

          import android.annotation.SuppressLint
          import android.content.ActivityNotFoundException
          import android.content.ClipData
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Matrix
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import android.util.Base64
          import android.webkit.JavascriptInterface
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.FileProvider
          import androidx.exifinterface.media.ExifInterface
          import androidx.webkit.WebViewAssetLoader
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions
          import org.json.JSONObject
          import java.io.ByteArrayInputStream
          import java.io.ByteArrayOutputStream
          import java.io.File
          import kotlin.math.max

          class MainActivity : AppCompatActivity() {

              private lateinit var webView: WebView
              private var filePathCallback: ValueCallback<Array<Uri>>? = null
              private var cameraUri: Uri? = null
              private var pendingShare: String? = null

              private val chooserLauncher =
                  registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { result ->
                      val callback = filePathCallback ?: return@registerForActivityResult
                      filePathCallback = null
                      var uris: Array<Uri>? = null
                      if (result.resultCode == RESULT_OK) {
                          val data = result.data
                          val clip = data?.clipData
                          uris = when {
                              clip != null && clip.itemCount > 0 -> Array(clip.itemCount) { clip.getItemAt(it).uri }
                              data?.data != null -> arrayOf(data.data!!)
                              cameraUri != null -> arrayOf(cameraUri!!)
                              else -> null
                          }
                      }
                      cameraUri = null
                      callback.onReceiveValue(uris)
                  }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  captureShare(intent)

                  webView = WebView(this)
                  setContentView(webView)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      allowFileAccess = false
                      allowContentAccess = false
                  }
                  webView.addJavascriptInterface(Bridge(), "SecondLookAndroid")

                  // Serves the bundled website from a secure https address, with no network needed.
                  val assetLoader = WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", WebViewAssetLoader.AssetsPathHandler(this))
                      .build()

                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(view: WebView, request: WebResourceRequest): WebResourceResponse? {
                          return assetLoader.shouldInterceptRequest(request.url)
                      }

                      override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {
                          val url = request.url
                          if (url.host == WebViewAssetLoader.DEFAULT_DOMAIN) return false
                          try {
                              startActivity(Intent(Intent.ACTION_VIEW, url))
                          } catch (_: ActivityNotFoundException) {
                          }
                          return true
                      }

                      override fun onPageFinished(view: WebView, url: String) {
                          deliverShare()
                      }
                  }

                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          webView: WebView,
                          callback: ValueCallback<Array<Uri>>,
                          params: FileChooserParams
                      ): Boolean {
                          filePathCallback?.onReceiveValue(null)
                          filePathCallback = callback
                          return try {
                              val launchIntent: Intent
                              if (params.isCaptureEnabled) {
                                  val dir = File(cacheDir, "photos").apply { mkdirs() }
                                  val file = File.createTempFile("photo_", ".jpg", dir)
                                  val uri = FileProvider.getUriForFile(this@MainActivity, "$packageName.fileprovider", file)
                                  cameraUri = uri
                                  launchIntent = Intent(MediaStore.ACTION_IMAGE_CAPTURE).apply {
                                      putExtra(MediaStore.EXTRA_OUTPUT, uri)
                                      clipData = ClipData.newRawUri("", uri)
                                      addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION or Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                  }
                              } else {
                                  launchIntent = params.createIntent()
                              }
                              chooserLauncher.launch(launchIntent)
                              true
                          } catch (e: Exception) {
                              filePathCallback = null
                              callback.onReceiveValue(null)
                              false
                          }
                      }
                  }

                  webView.loadUrl("https://${WebViewAssetLoader.DEFAULT_DOMAIN}/assets/web/index.html")
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  captureShare(intent)
                  deliverShare()
              }

              // ---------- Share to Second Look ----------

              private fun captureShare(intent: Intent?) {
                  if (intent?.action != Intent.ACTION_SEND) return
                  val type = intent.type ?: return
                  try {
                      if (type.startsWith("image/")) {
                          @Suppress("DEPRECATION")
                          val uri: Uri? = if (Build.VERSION.SDK_INT >= 33) {
                              intent.getParcelableExtra(Intent.EXTRA_STREAM, Uri::class.java)
                          } else {
                              intent.getParcelableExtra(Intent.EXTRA_STREAM)
                          }
                          if (uri != null) {
                              uriToDataUrl(uri)?.let {
                                  pendingShare = JSONObject().put("type", "image").put("data", it).toString()
                              }
                          }
                      } else if (type == "text/plain") {
                          val text = intent.getStringExtra(Intent.EXTRA_TEXT)
                          if (!text.isNullOrBlank()) {
                              pendingShare = JSONObject().put("type", "text").put("text", text).toString()
                          }
                      }
                  } catch (_: Exception) {
                  }
              }

              private fun deliverShare() {
                  if (pendingShare == null) return
                  webView.evaluateJavascript("window.__checkShared && window.__checkShared();", null)
              }

              private fun uriToDataUrl(uri: Uri): String? {
                  val bytes = contentResolver.openInputStream(uri)?.use { it.readBytes() } ?: return null
                  var bmp = decodeSampled(bytes, 2200) ?: return null
                  val degrees = rotationOf(bytes)
                  if (degrees != 0) {
                      val m = Matrix().apply { postRotate(degrees.toFloat()) }
                      bmp = Bitmap.createBitmap(bmp, 0, 0, bmp.width, bmp.height, m, true)
                  }
                  val out = ByteArrayOutputStream()
                  bmp.compress(Bitmap.CompressFormat.JPEG, 90, out)
                  return "data:image/jpeg;base64," + Base64.encodeToString(out.toByteArray(), Base64.NO_WRAP)
              }

              // ---------- Image helpers ----------

              private fun decodeSampled(bytes: ByteArray, maxSide: Int): Bitmap? {
                  val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  BitmapFactory.decodeByteArray(bytes, 0, bytes.size, bounds)
                  var sample = 1
                  while (max(bounds.outWidth, bounds.outHeight) / sample > maxSide) sample *= 2
                  val opts = BitmapFactory.Options().apply { inSampleSize = sample }
                  return BitmapFactory.decodeByteArray(bytes, 0, bytes.size, opts)
              }

              private fun rotationOf(bytes: ByteArray): Int {
                  return try {
                      val exif = ExifInterface(ByteArrayInputStream(bytes))
                      when (exif.getAttributeInt(ExifInterface.TAG_ORIENTATION, ExifInterface.ORIENTATION_NORMAL)) {
                          ExifInterface.ORIENTATION_ROTATE_90 -> 90
                          ExifInterface.ORIENTATION_ROTATE_180 -> 180
                          ExifInterface.ORIENTATION_ROTATE_270 -> 270
                          else -> 0
                      }
                  } catch (_: Exception) {
                      0
                  }
              }

              private fun replyToPage(id: String, text: String, error: String?) {
                  val json = JSONObject().put("id", id).put("text", text)
                  if (error != null) json.put("error", error)
                  runOnUiThread {
                      webView.evaluateJavascript("window.__nativeOCRDone($json);", null)
                  }
              }

              // ---------- JavaScript bridge used by the website ----------

              inner class Bridge {
                  /** Called by the page with a picture as a data URL. Reads the text on this phone. */
                  @JavascriptInterface
                  fun ocr(id: String, dataUrl: String) {
                      try {
                          val comma = dataUrl.indexOf(',')
                          if (comma < 0) {
                              replyToPage(id, "", "unreadable")
                              return
                          }
                          val bytes = Base64.decode(dataUrl.substring(comma + 1), Base64.DEFAULT)
                          val bitmap = decodeSampled(bytes, 3000)
                          if (bitmap == null) {
                              replyToPage(id, "", "unreadable")
                              return
                          }
                          val image = InputImage.fromBitmap(bitmap, rotationOf(bytes))
                          TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)
                              .process(image)
                              .addOnSuccessListener { replyToPage(id, it.text, null) }
                              .addOnFailureListener { replyToPage(id, "", "failed") }
                      } catch (e: Exception) {
                          replyToPage(id, "", "failed")
                      }
                  }

                  /** Returns a picture or text that was shared into the app, once. */
                  @JavascriptInterface
                  fun takeShared(): String {
                      val s = pendingShare ?: ""
                      pendingShare = null
                      return s
                  }
              }
          }
